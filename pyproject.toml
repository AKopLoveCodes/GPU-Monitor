[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-monitor"
version = "0.1.0"
description = "A local, read-only NVIDIA GPU dashboard for SSH-reachable servers"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "GPU Monitor Authors"}]
keywords = ["gpu", "nvidia", "nvidia-smi", "ssh", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]

[project.scripts]
gpu-monitor = "scripts.manage:main"

[tool.setuptools]
py-modules = ["server"]
packages = ["scripts", "web"]

[tool.setuptools.package-data]
web = ["*.css", "*.html", "*.js", "*.svg"]
